name: Build module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.check.outputs.update }}
      version: ${{ steps.check.outputs.version }}
      previous_version: ${{ steps.check.outputs.previous_version }}
    steps:
      - name: Check version bump
        id: check
        run: |
          version=$(gh release view --repo JoeBlakeB/ttf-twemoji --json tagName --jq .tagName)
          previous_version=$(gh release view --repo k2angel/ttf-twemoji-ksu --json tagName --jq .tagName)

          if [[ $version > $previous_version ]]; then
            echo "new version found: $version > $previous_version"
            echo "update=true" >> $GITHUB_OUTPUT
          else
            echo "no new version found: $version <= $previous_version"
            echo "update=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "previous_version=$previous_version" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: check_version
    runs-on: ubuntu-latest
    if: needs.check_version.outputs.update == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          repository: JoeBlakeB/ttf-twemoji
          tag: ${{ needs.check_version.outputs.version }}
          fileName: "Twemoji-${{ needs.check_version.outputs.version }}.ttf"
          out-file-path: "system/fonts"
      - name: Bump
        run: |
          VERSION_CODE=$(echo ${{ needs.check_version.outputs.version }} | tr -d '.')
          sed -i "s/^version=.*/version=${{ needs.check_version.outputs.version }}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$VERSION_CODE/" module.prop
          jq --arg ver "${{ needs.check_version.outputs.version }}" \
             --arg verCode "$VERSION_CODE" \
             '.version = $ver | .versionCode = ($verCode | tonumber)' update.json > update.json.tmp && mv update.json.tmp update.json
          echo 'Bump to ${{ needs.check_version.outputs.version }}' > changelog.txt
      - name: Create artifact
        run: |
          mv 'system/fonts/Twemoji-${{ needs.check_version.outputs.version }}.ttf' 'system/fonts/NotoColorEmoji.ttf'
          zip -r ttf-twemoji-ksu.zip system module.prop
      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          add: "module.prop update.json changelog.txt"
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Bump to ${{ needs.check_version.outputs.version }}"
      - name: Upload artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ttf-twemoji-ksu.zip
          asset_name: ttf-twemoji-ksu.zip
          tag: ${{ needs.check_version.outputs.version }}
          overwrite: true
          release_name: ttf-twemoji-ksu ${{ needs.check_version.outputs.version }}
